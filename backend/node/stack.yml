version: "3.9"

services:
  api:
    image: ghcr.io/YOUR_GH_OWNER/todo-api:${IMAGE_TAG}
    env_file:
      - ./app.env
    networks:
      - edge
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 30s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.docker.network=edge
        - traefik.http.routers.todo-api.rule=Host(`api-todo.phamvuong.io.vn`)
        - traefik.http.routers.todo-api.entrypoints=web
        - traefik.http.services.todo-api.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cron:
    image: ghcr.io/YOUR_GH_OWNER/todo-api:${IMAGE_TAG}
    env_file:
      - ./app.env
    command: ["node", "dist/cron.js"]
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 30s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

networks:
  edge:
    external: true
  internal:
    driver: overlay
    attachable: true
